<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Progress Assessment</title>
<meta name="description" content="T Level Engineering and Manufacturing core progress assessment, pre half term.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <img src="img/tmc.png" alt="The Manchester College" class="logo-tmc">
  <div class="topbar-mid" id="topbarMid"></div>
  <div class="a11y">
    <button type="button" class="chip" id="btnText" aria-pressed="false" title="Larger text">A+ Larger text</button>
    <button type="button" class="chip" id="btnCream" aria-pressed="false" title="Cream background (reading support)">◐ Cream background</button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <img src="img/cg.png" alt="City &amp; Guilds" class="logo-cg">
  <span>T Level Technical Qualification in Engineering and Manufacturing · Core progress assessment · Pre half term</span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
