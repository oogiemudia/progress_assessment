<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Results Dashboard</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<style>
  main { max-width: 1200px; }
  .drop { border: 3px dashed var(--teal); border-radius: 14px; padding: 30px; text-align: center; background: var(--soft); cursor: pointer; }
  .drop.over { background: #e3f3f5; }
  table.res { width: 100%; border-collapse: collapse; font-size: .74rem; }
  table.res th, table.res td { border: 1px solid var(--line); padding: 7px 8px; text-align: left; }
  table.res th { background: var(--navy); color: #fff; position: sticky; top: 0; cursor: pointer; }
  table.res tr:hover td { background: #f5f9fd; }
  .heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
  .heat div { border-radius: 8px; padding: 8px 4px; text-align: center; color: #fff; font-size: .7rem; font-weight: bold; }
  .ov { width: 64px; padding: 4px; border: 2px solid var(--amber); border-radius: 6px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
</style>
</head>
<body>
<header class="topbar">
  <img src="img/tmc.png" alt="The Manchester College" class="logo-tmc">
  <div class="topbar-mid"><b style="color:var(--navy)">Teacher results dashboard</b> · Core progress assessment</div>
  <a class="chip" href="index.html">Learner quiz</a>
</header>
<main id="t" tabindex="-1"></main>
<footer class="foot"><img src="img/cg.png" alt="City &amp; Guilds" class="logo-cg"><span>Your moderation overrides stay in this browser.</span></footer>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
